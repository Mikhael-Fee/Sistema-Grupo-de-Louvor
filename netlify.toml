[build]
  command = "npm run build"
  publish = "dist"
  # Each production publish costs Netlify credits. Skip the build (exit 0) when
  # the change touches only tests, documentation, CI or database migrations,
  # which do not change the published site.
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)tests' ':(exclude,glob)src/**/*.test.ts' ':(exclude)docs' ':(exclude,glob)*.md' ':(exclude).github' ':(exclude)supabase' ':(exclude)playwright.config.ts'"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Only this site's own code runs; data comes from Supabase, lyrics from LRCLIB, thumbnails from YouTube.
    # Keep in sync with public/_headers and tests/content-security.spec.ts.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://i.ytimg.com; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://lrclib.net; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/downloads/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/downloads/candeia-cifraclub-firefox.xpi"
  [headers.values]
    Content-Type = "application/x-xpinstall"

[[headers]]
  for = "/downloads/candeia-cifraclub-firefox-unsigned.xpi"
  [headers.values]
    Content-Type = "application/x-xpinstall"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
